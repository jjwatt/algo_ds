[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "algo-ds-python"
version = "0.1.0"
description = "Python algorithms, data structures, and problem solutions"
readme = "README.md"
authors = [
    { name = "Jesse Wattenbarger", email = "jwatt@broken.watch" }
]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "debugpy>=1.8.22",
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = [
    "myalgs",
    "leetcode",
    "hackerrank",
    "neetcode",
    "ctci",
]

[tool.pytest.ini_options]
testpaths = [
    "myalgs",
    "leetcode",
    "hackerrank",
    "neetcode",
    "ctci",
]

[tool.ty.rules]
possibly-unresolved-reference = "warn"

[tool.ruff.lint]
extend-select = ["ANN", "PYI"]
preview = true

[tool.mypy]
strict_optional = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
